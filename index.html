const L=keys.left,R=keys.right,D=keys.down;if(P.grounded){const slope=P.plat?0:slopeAt(P.x),cs=1/Math.hypot(1,slope);if(D&&Math.abs(P.spd)<.6&&!P.plat){P.charge=Math.max(.001,P.charge);if(just){P.charge=Math.min(8,P.charge+2);tone(180+P.charge*45,.08,.1);burst(P.x,P.y+9,'dust',3)}P.spd*=.8}else{if(P.charge>0&&!D){P.spd=P.dir*(7+P.charge);P.charge=0;P.rolling=true;sound.dash()}else if(!D)P.charge=0;if(P.lock<=0&&P.charge<=0){if(L&&!R){P.spd=P.spd>1?P.spd-.5:Math.max(P.spd-.06,-6.2);P.dir=-1}else if(R&&!L){P.spd=P.spd< -1?P.spd+.5:Math.min(P.spd+.06,6.2);P.dir=1}else P.spd=Math.abs(P.spd)<.05?0:P.spd-Math.sign(P.spd)*(P.rolling?.02:.05)}if(D&&Math.abs(P.spd)>.5)P.rolling=true;if(!D&&P.charge===0&&Math.abs(P.spd)<6)P.rolling=false;P.spd=clamp(P.spd+slope*.11,-13,13);if(just&&!D&&P.lock<=0){P.vy=-6.6;P.vx=P.spd*cs;P.grounded=false;P.jumping=true;P.rolling=false;sound.jump()}if(P.grounded){const nx=P.x+P.spd*cs,gy=P.plat?P.plat[1]:groundAt(nx);if(gy!==null&&Math.abs(gy-(P.y+P.h))<26){P.x=nx;P.y=gy-P.h;P.plat=null;const s=support(P.x,P.y+P.h);if(s?.plat)P.plat=s.plat}else{P.grounded=false;P.vx=P.spd;P.vy=0;P.jumping=false}P.rot+=P.spd*.3;if(P.grounded&&Math.abs(P.x-loop.x)<7&&P.spd>=3.8){P.loop=true;P.angle=Math.PI/2;P.grounded=false;sound.dash()}for(const d of dashes)if(P.grounded&&P.x>d[0]&&P.x<d[0]+d[2]&&Math.abs(P.y+P.h-d[1])<12&&P.spd<9.3){P.spd=9.5;P.dir=1;P.rolling=true;sound.dash()}}}}
